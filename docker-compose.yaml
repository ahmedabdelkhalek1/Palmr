version: "3.8"

services:
  palmr:
    image: kyantech/palmr:latest
    container_name: palmr
    ports:
      - "5487:5487"
    environment:
      ENABLE_S3: false
      ENCRYPTION_KEY: your_encryption_key_here
      PALMR_UID: 1000
      PALMR_GID: 1000
    volumes:
      - palmr_data:/data

volumes:
  palmr_data:

services:
  palmr:
    image: kyantech/palmr:latest
    ports:
      - "5487:5487"
    environment:
      PALMR_UID: 1000
      PALMR_GID: 1000
      ENCRYPTION_KEY: your_encryption_key_here
    volumes:
      - palmr_data:/app/palmr-app/uploads
    command: >
      sh -c "mkdir -p /app/palmr-app/uploads &&
             chown -R 1000:1000 /app/palmr-app/uploads &&
             exec node /app/palmr-app/main.js"
volumes:
  palmr_data:
